                    <!-- Kiri: Judul & Tabs -->

        <!-- ==================== MODAL TAMBAH / EDIT BATCH ==================== -->
        <div id="tambahBatchModal"
            class="fixed inset-0 bg-black bg-opacity-0 flex items-center justify-center z-50 p-4 opacity-0 pointer-events-none transition-all duration-300">

            <div id="modalBox"
                class="bg-brand-bg rounded-lg shadow-xl w-full max-w-[600px] overflow-hidden border border-gray-400 transform scale-95 opacity-0 transition-all duration-300">

                <!-- Modal Header -->
                <div class="bg-white px-6 py-4 flex justify-between items-start">
                    <div>
                        <h2 id="modalTitle" class="text-[17px] font-bold text-black leading-tight">Batch Deadline</h2>
                        <p class="text-[13px] text-gray-700 mt-1">Atur tenggat waktu batch pada halaman ini</p>
                    </div>
                    <button onclick="closeModal()"
                        class="w-8 h-8 bg-[#ff4a4a] text-white rounded flex items-center justify-center hover:bg-red-600 transition shadow-sm mt-0.5">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="p-6 pb-8 border-t border-gray-400">

                    <div class="mb-5">
                        <span id="modalBadge"
                            class="inline-block px-4 py-1.5 bg-white border border-black rounded text-[15px] font-bold text-black leading-none">
                            Batch Baru
                        </span>
                    </div>

                    <!-- Input Jam -->
                    <div class="bg-[#4142cf] rounded flex flex-col md:flex-row mb-4 shadow-sm w-full border border-[#4142cf]">
                        <div class="w-[80px] min-h-[80px] flex items-center justify-center border-r border-[#696ce6] flex-shrink-0 relative">
                            <i class="fa-regular fa-clock text-white text-[32px]"></i>
                            <i class="fa-solid fa-clock text-white text-[12px] bg-[#4142cf] rounded-full absolute bottom-[22px] right-[20px] border border-[#4142cf]"></i>
                        </div>
                        <div class="flex-1 p-4 px-5">
                            <div class="flex flex-col sm:flex-row gap-4">
                                <div class="flex-1">
                                    <label class="block text-white text-[13px] mb-1.5">Start</label>
                                    <input type="time" class="w-full bg-white rounded-md px-3 py-1.5 text-black outline-none h-[34px] shadow-sm">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-white text-[13px] mb-1.5">End</label>
                                    <input type="time" class="w-full bg-white rounded-md px-3 py-1.5 text-black outline-none h-[34px] shadow-sm">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Input Tanggal -->
                    <div class="bg-[#4142cf] rounded flex flex-col md:flex-row mb-6 shadow-sm w-full border border-[#4142cf]">
                        <div class="w-[80px] min-h-[80px] flex items-center justify-center border-r border-[#696ce6] flex-shrink-0 relative">
                            <i class="fa-regular fa-calendar text-white text-[32px]"></i>
                            <i class="fa-solid fa-clock text-white text-[12px] bg-[#4142cf] rounded-full absolute bottom-[22px] right-[20px] border border-[#4142cf]"></i>
                        </div>
                        <div class="flex-1 p-4 px-5">
                            <div class="flex flex-col sm:flex-row gap-4">
                                <div class="flex-1">
                                    <label class="block text-white text-[13px] mb-1.5">Start</label>
                                    <input type="date" class="w-full bg-white rounded-md px-3 py-1.5 text-black outline-none h-[34px] shadow-sm text-[13px]">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-white text-[13px] mb-1.5">End</label>
                                    <input type="date" class="w-full bg-white rounded-md px-3 py-1.5 text-black outline-none h-[34px] shadow-sm text-[13px]">

                    <button onclick="simpanBatch()"

        <!-- ==================== JAVASCRIPT ==================== -->
        <script>
            // ----- Data Source -----
            const batchData = [
                { id: 1, label: 'Batch 1', deadline: '12 April 2026, 17.00 WIB',    color: '#fdf3df', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 2, label: 'Batch 2', deadline: '13 Mei 2026, 12.30 WIB',      color: '#e4efe0', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 3, label: 'Batch 3', deadline: '28 Mei 2026, 18.00 WIB',      color: '#fce1e1', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 4, label: 'Batch 4', deadline: '26 Juni 2026, 16.00 WIB',     color: '#fdf3df', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 5, label: 'Batch 5', deadline: '28 Juni 2026, 12.45 WIB',     color: '#e4efe0', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 6, label: 'Batch 6', deadline: '28 Juli 2026, 20.00 WIB',     color: '#fce1e1', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 7, label: 'Batch 7', deadline: '2 Agustus 2026, 17.00 WIB',   color: '#fdf3df', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 8, label: 'Batch 8', deadline: '13 Agustus 2026, 13.30 WIB',  color: '#e4efe0', bodyColor: '#faebca', link: 'tambah_barang' },
                { id: 9, label: 'Batch 9', deadline: '28 September 2026, 12.00 WIB',color: '#fce1e1', bodyColor: '#faebca', link: 'tambah_barang' },
            ];

            // ----- Render Batch Card -----
            function createBatchCard(batch) {
                const card = document.createElement('div');
                card.dataset.batchId = batch.id;
                card.className = 'border border-gray-400 rounded-lg flex flex-col bg-white overflow-hidden shadow-sm transition-transform duration-300 ease-in-out hover:scale-105 hover:shadow-lg cursor-pointer';
                card.innerHTML = `
                    <div class="py-4 border-b border-gray-400 text-center" style="background-color: ${batch.color};">
                        <h2 class="text-lg font-bold text-black">${batch.label}</h2>
                    </div>
                    <div class="p-3">
                        <div class="rounded-md p-2 w-full text-left mb-3" style="background-color: ${batch.bodyColor};">
                            <p class="text-[9px] font-bold text-green-800 leading-tight">BATAS WAKTU</p>
                            <p class="text-[12px] font-bold text-black mt-0.5">${batch.deadline}</p>
                        </div>
                        <div class="flex items-center justify-end gap-2 text-gray-600 text-[20px]">
                            <button class="btn-edit hover:text-black transition" title="Edit ${batch.label}">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                            <button class="btn-delete hover:text-red-500 transition" title="Hapus ${batch.label}">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>`;

                // Navigasi ke detail saat klik area judul
                card.querySelector('h2').parentElement.addEventListener('click', () => {
                    window.location.href = batch.link;
                });

                // Aksi Edit
                card.querySelector('.btn-edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(batch.label);
                });

                // Aksi Hapus
                card.querySelector('.btn-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    confirmDelete(card, batch.label);
                });

                return card;
            }

            function renderBatchGrid(data) {
                const grid = document.getElementById('batchGrid');
                grid.innerHTML = '';
                data.forEach(batch => grid.appendChild(createBatchCard(batch)));
            }

            // ----- Search -----
            function setupSearch() {
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = batchData.filter(b => b.label.toLowerCase().includes(term));
                    renderBatchGrid(filtered);
                });
            }

            // ----- Konfirmasi Hapus -----
            function confirmDelete(card, label) {
                Swal.fire({
                    heightAuto: false,
                    scrollbarPadding: false,
                    title: `Hapus ${label}?`,
                    text: 'Data ini akan dihapus permanen!',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#4b5563',
                    confirmButtonText: 'Ya, hapus!',
                    cancelButtonText: 'Batal',
                    customClass: { popup: 'rounded-xl border border-gray-200 shadow-xl' }
                }).then((result) => {
                    if (!result.isConfirmed) return;

                    Object.assign(card.style, { transition: 'all 0.3s ease', transform: 'scale(0.8)', opacity: '0' });

                    setTimeout(() => {
                        card.remove();
                        Swal.fire({
                            heightAuto: false,
                            scrollbarPadding: false,
                            title: 'Terhapus!',
                            text: `${label} berhasil dihapus.`,
                            icon: 'success',
                            showConfirmButton: false,
                            timer: 1500,
                            customClass: { popup: 'rounded-xl border border-gray-200 shadow-xl' }
                        });
                    }, 300);
                });
            }

            // ----- Modal -----
            function openModal(batchName = null) {
                const isEdit = batchName !== null;
                document.getElementById('modalTitle').textContent = isEdit ? `Edit ${batchName}` : 'Batch Deadline';
                document.getElementById('modalBadge').textContent  = isEdit ? batchName : 'Batch Baru';

                const modal = document.getElementById('tambahBatchModal');
                const box   = document.getElementById('modalBox');
                modal.classList.remove('pointer-events-none', 'opacity-0');
                modal.classList.add('opacity-100', 'bg-opacity-40');
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }

            function closeModal() {
                const modal = document.getElementById('tambahBatchModal');
                const box   = document.getElementById('modalBox');
                modal.classList.remove('opacity-100', 'bg-opacity-40');
                modal.classList.add('opacity-0');
                box.classList.remove('scale-100', 'opacity-100');
                box.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modal.classList.add('pointer-events-none'), 300);
            }

            function simpanBatch() {
                closeModal();
                setTimeout(() => {
                    Swal.fire({
                        heightAuto: false,
                        scrollbarPadding: false,
                        title: 'Tersimpan!',
                        text: 'Data batch berhasil disimpan.',
                        icon: 'success',
                        showConfirmButton: false,
                        timer: 1500,
                        customClass: { popup: 'rounded-xl border border-gray-200 shadow-xl' }
                    });
                }, 300);
            }

            // ----- Sidebar -----
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                const isHidden = sidebar.classList.contains('-translate-x-full');
                sidebar.classList.toggle('-translate-x-full', !isHidden);
                overlay.classList.toggle('hidden', !isHidden);
            }

            // ----- Init -----
            document.addEventListener('DOMContentLoaded', () => {
                renderBatchGrid(batchData);
                setupSearch();
            });
        </script>

    </body>
